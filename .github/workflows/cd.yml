name: CD

on:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy using github-hosted runner
    runs-on: ubuntu-latest
    env:
      DOCKER_USERNAME_SECRET: ${{ secrets.DOCKER_USERNAME }}
      DOCKER_TOKEN_SECRET: ${{ secrets.DOCKER_TOKEN_CD }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        if: env.DOCKER_USERNAME_SECRET != '' && env.DOCKER_TOKEN_SECRET != ''
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN_CD }}

      - name: Prepare environment
        run: touch .env

      - name: Pull latest Docker images
        env:
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
        run: docker compose pull

      - name: Start application
        env:
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
        run: docker compose up -d

      - name: Check containers
        run: docker compose ps