name: CD

on:
  workflow_run:
    workflows: ["CI"]
    branches:
      - main
    types:
      - completed

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    name: Deploy using github-hosted runner
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    env:
      DOCKER_USERNAME_SECRET: ${{ secrets.DOCKER_USERNAME }}
      DOCKER_TOKEN_SECRET: ${{ secrets.DOCKER_TOKEN_CD }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Install deployment dependencies
        run: python -m pip install boto3

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: us-east-1

      - name: Login to Docker Hub
        if: env.DOCKER_USERNAME_SECRET != '' && env.DOCKER_TOKEN_SECRET != ''
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN_CD }}

      - name: Deploy using AWS Secrets Manager
        env:
          AWS_SECRET_NAME: intelliview-secrets
          AWS_REGION: us-east-1
        run: python scripts/deploy_with_secrets.py

      - name: Check containers
        run: docker compose -f docker-compose.yml ps
